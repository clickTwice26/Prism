# nginx site for https://prism.shagato.space (see deploy/README.md).
# The web app is on 127.0.0.1:28740; /api and /ws go to the Go API on 127.0.0.1:28741.
# certbot --nginx adds the listen 443 / certificate lines.
server {
    listen 80;
    listen [::]:80;
    server_name prism.shagato.space;

    # Sign video uploads.
    client_max_body_size 64m;

    location /api/ {
        proxy_pass         http://127.0.0.1:28741;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Live class relay (WebSocket).
    location /ws/ {
        proxy_pass         http://127.0.0.1:28741;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass         http://127.0.0.1:28740;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
