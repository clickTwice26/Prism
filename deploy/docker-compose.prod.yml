# Production stack for https://prism.shagato.space.
# Run from the repo root:
#   docker compose -f deploy/docker-compose.prod.yml -p prism up -d --build
# Only the web app (127.0.0.1:28740) and API (127.0.0.1:28741) are published,
# on localhost; nginx on the host serves the domain (deploy/nginx/).
name: prism

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: prism
      POSTGRES_DB: prism
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prism -d prism"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ../backend
    restart: unless-stopped
    env_file:
      - path: ../backend/.env
        required: false
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://prism:prism@postgres:5432/prism?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: https://prism.shagato.space
      SIGN_REFERENCE_DIR: /app/signref
    ports:
      - "127.0.0.1:28741:8080"
    volumes:
      - signmedia:/app/media/signs
      - ../data/isharakotha/raw/extracted:/app/signref:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: https://prism.shagato.space
    restart: unless-stopped
    ports:
      - "127.0.0.1:28740:3100"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  signmedia:
