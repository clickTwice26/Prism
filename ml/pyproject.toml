[project]
name = "prism-ml"
version = "0.1.0"
description = "Training and evaluation tools for Prism's Bangla Sign Language recognition"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prism_ml"]
